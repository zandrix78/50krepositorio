<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | 50K Restaurante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-hero">
          <div class="brand-mark large">50K</div>
          <h1>50K Restaurante</h1>
          <p>Gestão inteligente para restaurantes e redes.</p>
        </div>

        <form class="auth-form">
          <div class="field-group">
            <label>E-mail</label>
            <input type="email" value="admin@50krestaurante.com" />
          </div>
          <div class="field-group">
            <label>Senha</label>
            <input type="password" value="123456" />
          </div>
          <div class="row-between">
            <label class="checkbox"><input type="checkbox" checked /> Lembrar-me</label>
            <a href="#">Esqueci a senha</a>
          </div>
          <a href="index.html" class="primary-btn full-btn">Entrar no sistema</a>
        </form>
      </div>
    </div>
  </body>
</html>
